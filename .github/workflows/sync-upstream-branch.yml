name: Sync Upstream Branch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LiteVG Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror official LVGL master to upstream branch
        run: |
          git remote add lvgl https://github.com/lvgl/lvgl.git
          git fetch lvgl master
          git fetch origin upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync-upstream refs/remotes/origin/upstream
          git read-tree --reset -u refs/remotes/lvgl/master
          git restore --source=HEAD --staged --worktree .github/workflows
          if git diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          else
            git commit -m "Sync upstream branch"
          fi
          git push origin HEAD:refs/heads/upstream --force
